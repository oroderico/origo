name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Run verifier tests
        run: python3 -m unittest discover -s tests -v

      - name: Run QR host smoke test
        run: |
          cc -std=c11 -Wall -Wextra -Werror -DLOCK_VERSION=5 -Imain \
            main/qrcode.c tests/qrcode_smoke.c -o /tmp/origo-qrcode-smoke
          /tmp/origo-qrcode-smoke

      - name: Build twice and audit
        run: |
          idf.py -B "$GITHUB_WORKSPACE/build-a" \
            -D SDKCONFIG="$GITHUB_WORKSPACE/build-a/sdkconfig" build
          idf.py -B "$GITHUB_WORKSPACE/build-b" \
            -D SDKCONFIG="$GITHUB_WORKSPACE/build-b/sdkconfig" build
          python3 tools/audit_origo_elf.py build-a/origo.elf \
            --map build-a/origo.map --bin build-a/origo.bin \
            --nm xtensa-esp32-elf-nm
          python3 tools/audit_origo_elf.py build-b/origo.elf \
            --map build-b/origo.map --bin build-b/origo.bin \
            --nm xtensa-esp32-elf-nm
          cmp build-a/origo.bin build-b/origo.bin
          sha256sum build-a/origo.bin > SHA256SUMS

      - name: Upload audited firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: origo-${{ github.sha }}
          path: |
            build-a/origo.bin
            SHA256SUMS
          if-no-files-found: error

