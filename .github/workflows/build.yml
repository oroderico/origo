name: build

on:
  # Branch pushes are covered by pull_request; listing both ran every commit on
  # a branch with an open PR twice. Pushes to main still build so that the
  # audited artifact and its SHA256SUMS exist for every released commit.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-simulator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          submodules: recursive

      - name: Install SDL development files
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Build and test shared host core
        run: ./tools/run-simulator.sh --self-test

  # The self-test again, instrumented. Reading the code finds the bugs someone
  # thought to look for; this finds the out-of-bounds access and the undefined
  # behaviour nobody did. Kept a separate job so a sanitizer failure is
  # distinguishable at a glance from the plain self-test failing.
  sanitized-host:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          submodules: recursive

      - name: Install SDL development files
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      # Origo's own sources only: libwally is vendored and trusted, and
      # secp256k1's inline assembly does not compile instrumented. clang
      # rather than the default compiler because that is the combination this
      # was validated against - GCC on some distributions ships the sanitizer
      # link stubs without the runtime, and the failure looks like a linker
      # error rather than a finding.
      - name: Build and run the self-test under ASan and UBSan
        run: |
          cmake -S host -B build-sanitize -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DORIGO_SANITIZE=ON
          cmake --build build-sanitize --parallel
          ./build-sanitize/origo-simulator --self-test

  deterministic-firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Run verifier tests
        run: python3 -m unittest discover -s tests -v

      # No -DLOCK_VERSION: the firmware does not define it either, so qrcode.h's
      # default of 0 applies and the encoder's internal version guards compile
      # out. Building the test with -DLOCK_VERSION=5 used to make it assert a
      # rejection the shipped encoder does not perform.
      - name: Run QR host smoke test
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Imain \
            main/qrcode.c tests/qrcode_smoke.c -o /tmp/origo-qrcode-smoke
          /tmp/origo-qrcode-smoke

      - name: Build twice and audit
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          idf.py -B "$GITHUB_WORKSPACE/build-a" \
            -D SDKCONFIG="$GITHUB_WORKSPACE/build-a/sdkconfig" build
          idf.py -B "$GITHUB_WORKSPACE/build-b" \
            -D SDKCONFIG="$GITHUB_WORKSPACE/build-b/sdkconfig" build
          python3 tools/audit_origo_elf.py build-a/origo.elf \
            --map build-a/origo.map --bin build-a/origo.bin \
            --nm xtensa-esp32-elf-nm
          python3 tools/audit_origo_elf.py build-b/origo.elf \
            --map build-b/origo.map --bin build-b/origo.bin \
            --nm xtensa-esp32-elf-nm
          cmp build-a/origo.bin build-b/origo.bin
          sha256sum build-a/origo.bin > SHA256SUMS

      - name: Upload audited firmware
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: origo-${{ github.sha }}
          path: |
            build-a/origo.bin
            SHA256SUMS
          if-no-files-found: error
