name: build

on:
  # Branch pushes are covered by pull_request; listing both ran every commit on
  # a branch with an open PR twice. Pushes to main still build so that the
  # audited artifact and its SHA256SUMS exist for every released commit.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          submodules: recursive

      - name: Install SDL development files
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Build and run the tests
        run: |
          cmake -S host -B build-host -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-host --parallel
          ctest --test-dir build-host --output-on-failure

      # The same tests instrumented, as its own step so a sanitizer finding is
      # told apart from a failing check at a glance. clang because GCC on some
      # distributions ships the sanitizer link stubs without the runtime.
      - name: Run the tests under ASan and UBSan
        run: |
          cmake -S host -B build-sanitize -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DORIGO_SANITIZE=ON
          cmake --build build-sanitize --parallel
          ctest --test-dir build-sanitize --output-on-failure

      - name: Run verifier tests
        run: python3 -m unittest discover -s tests -v

      # A short run: enough to keep the harness building against the current
      # API and to catch a shallow regression, not a substitute for the long
      # runs tests/fuzz_parsers.c describes.
      - name: Fuzz the parsers for one minute
        run: |
          clang -fsanitize=fuzzer,address,undefined -g -std=gnu11 \
            -Imain -Icomponents/libwally-core/upstream/include \
            main/seedtool_core.c main/seedtool_bbqr.c main/seedtool_wordlist.c \
            tests/fuzz_parsers.c build-host/libwally_host.a -lm -o fuzz-parsers
          ./fuzz-parsers -max_total_time=60

  deterministic-firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build twice and audit
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          idf.py -B "$GITHUB_WORKSPACE/build-a" \
            -D SDKCONFIG="$GITHUB_WORKSPACE/build-a/sdkconfig" build
          idf.py -B "$GITHUB_WORKSPACE/build-b" \
            -D SDKCONFIG="$GITHUB_WORKSPACE/build-b/sdkconfig" build
          cmp build-a/origo.bin build-b/origo.bin
          python3 tools/audit_origo_elf.py build-a/origo.elf \
            --map build-a/origo.map --bin build-a/origo.bin \
            --nm xtensa-esp32-elf-nm
          sha256sum build-a/origo.bin > SHA256SUMS

      - name: Upload audited firmware
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: origo-${{ github.sha }}
          path: |
            build-a/origo.bin
            SHA256SUMS
          if-no-files-found: error
